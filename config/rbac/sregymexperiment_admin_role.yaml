# This rule is not used by the project sregym-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over batch.sregym-controller.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sregym-controller
    app.kubernetes.io/managed-by: kustomize
  name: sregymexperiment-admin-role
rules:
- apiGroups:
  - batch.sregym-controller.io
  resources:
  - sregymexperiments
  verbs:
  - '*'
- apiGroups:
  - batch.sregym-controller.io
  resources:
  - sregymexperiments/status
  verbs:
  - get
