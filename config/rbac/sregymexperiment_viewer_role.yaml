# This rule is not used by the project sregym-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to batch.sregym-controller.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sregym-controller
    app.kubernetes.io/managed-by: kustomize
  name: sregymexperiment-viewer-role
rules:
- apiGroups:
  - batch.sregym-controller.io
  resources:
  - sregymexperiments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch.sregym-controller.io
  resources:
  - sregymexperiments/status
  verbs:
  - get
